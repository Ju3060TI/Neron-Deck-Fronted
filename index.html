<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NERON DECK - Pair & Stream</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e14;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      padding: 20px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #00ffcc33;
      padding-bottom: 15px;
    }
    .header h1 {
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 0 0 10px #00ffcc;
    }
    .header p {
      color: #00ffcc66;
      font-size: 12px;
      margin-top: 5px;
    }
    .panel {
      max-width: 700px;
      margin: 0 auto 20px;
      border: 1px solid #00ffcc33;
      border-radius: 8px;
      padding: 20px;
      background: #0d1117;
    }
    .panel h2 {
      font-size: 14px;
      color: #00ffcc;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }
    .code-display {
      text-align: center;
      font-size: 48px;
      letter-spacing: 12px;
      color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc;
      padding: 20px;
      background: #000;
      border-radius: 6px;
      margin: 10px 0;
      font-weight: bold;
    }
    .code-input {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }
    input[type="text"] {
      background: #000;
      border: 2px solid #00ffcc66;
      color: #00ffcc;
      padding: 12px 20px;
      font-size: 24px;
      font-family: 'Courier New', monospace;
      letter-spacing: 8px;
      text-align: center;
      width: 220px;
      border-radius: 4px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 15px #00ffcc44;
    }
    button {
      background: transparent;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 12px 24px;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
      border-radius: 4px;
    }
    button:hover:not(:disabled) {
      background: #00ffcc;
      color: #0a0e14;
      box-shadow: 0 0 20px #00ffcc66;
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .status-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3333;
      margin-right: 6px;
      vertical-align: middle;
    }
    .status-dot.connected { background: #00ffcc; box-shadow: 0 0 8px #00ffcc; }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      border: 2px solid #00ffcc44;
      border-radius: 8px;
      background: #000;
      aspect-ratio: 16/9;
      overflow: hidden;
      display: none;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .video-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffcc44;
      font-size: 16px;
      pointer-events: none;
    }
    .log {
      width: 90%;
      max-width: 1000px;
      margin: 15px auto 0;
      background: #0d1117;
      border: 1px solid #00ffcc22;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      color: #00ffcc88;
      max-height: 150px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .log-entry { margin-bottom: 2px; }
    .controls { text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>NERON DECK</h1>
    <p>Pair & Stream</p>
  </div>

  <!-- SENDER PANEL -->
  <div class="panel" id="senderPanel">
    <h2>▶ SENDER — DEIN CODE</h2>
    <div class="code-display" id="myCode">------</div>
    <div class="controls">
      <button id="shareBtn">▶ START STREAM</button>
      <button id="stopBtn" disabled>■ STOP</button>
    </div>
  </div>

  <!-- RECEIVER PANEL -->
  <div class="panel" id="receiverPanel">
    <h2>◀ RECEIVER — CODE EINGEBEN</h2>
    <div class="code-input">
      <input type="text" id="joinCode" maxlength="6" placeholder="000000" />
      <button id="joinBtn">VERBINDEN</button>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot" id="connDot"></span><span id="connText">Warte auf Verbindung...</span></span>
  </div>

  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="video-placeholder" id="placeholder">WAITING FOR STREAM...</div>
  </div>

  <div class="log" id="log"></div>

  <script type="module">
    import webconnect from 'https://cdn.jsdelivr.net/npm/webconnect/dist/esm/webconnect.js';

    const videoEl = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');
    const placeholder = document.getElementById('placeholder');
    const shareBtn = document.getElementById('shareBtn');
    const stopBtn = document.getElementById('stopBtn');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');
    const logEl = document.getElementById('log');
    const myCodeEl = document.getElementById('myCode');
    const joinCodeEl = document.getElementById('joinCode');
    const joinBtn = document.getElementById('joinBtn');
    const senderPanel = document.getElementById('senderPanel');
    const receiverPanel = document.getElementById('receiverPanel');

    let currentStream = null;
    let connect = null;
    let myCode = null;

    function log(msg) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.prepend(entry);
    }

    function generateCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function initConnection(channelCode) {
      if (connect) return;
      log(`Joining channel ${channelCode}`);

      connect = webconnect({
        appName: 'neron-deck',
        channelName: channelCode
      });

      connect.onConnect((attr) => {
        connDot.classList.add('connected');
        connText.textContent = `Verbunden (${attr.connectId})`;
        log(`Peer connected: ${attr.connectId}`);
      });

      connect.onDisconnect((attr) => {
        connDot.classList.remove('connected');
        connText.textContent = 'Getrennt';
        log(`Peer disconnected: ${attr.connectId}`);
      });

      connect.onStreaming((stream, attr) => {
        log(`Stream empfangen von ${attr.connectId}`);
        videoContainer.style.display = 'block';
        videoEl.srcObject = stream;
        placeholder.style.display = 'none';
        videoEl.play().catch(e => log(`Playback error: ${e.message}`));
      });
    }

    // SENDER: Code generieren und anzeigen
    myCode = generateCode();
    myCodeEl.textContent = myCode;
    initConnection(myCode);

    shareBtn.addEventListener('click', async () => {
      try {
        log('Requesting camera...');
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720 },
          audio: false
        });

        currentStream = stream;
        videoContainer.style.display = 'block';
        videoEl.srcObject = stream;
        placeholder.style.display = 'none';
        videoEl.play().catch(e => log(`Playback error: ${e.message}`));

        connect.openStreaming(stream, { metadata: { name: 'neron-camera' } });

        log('Stream gestartet');
        shareBtn.disabled = true;
        stopBtn.disabled = false;

        stream.getVideoTracks()[0].onended = () => stopSharing();

      } catch (err) {
        log(`Stream failed: ${err.message}`);
      }
    });

    function stopSharing() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      if (connect) connect.closeStreaming({});
      videoEl.srcObject = null;
      placeholder.style.display = 'block';
      shareBtn.disabled = false;
      stopBtn.disabled = true;
      log('Stream gestoppt');
    }

    stopBtn.addEventListener('click', stopSharing);

    // RECEIVER: Code eingeben und verbinden
    joinBtn.addEventListener('click', () => {
      const code = joinCodeEl.value.trim();
      if (!/^\d{6}$/.test(code)) {
        alert('Bitte 6-stelligen Code eingeben');
        return;
      }
      initConnection(code);
      log(`Verbinde mit Code ${code}...`);
    });

  </script>

</body>
</html>
